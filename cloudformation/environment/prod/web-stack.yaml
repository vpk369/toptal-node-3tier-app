Outputs:
  EndPoint:
    Description: Toptal Web EndPoint url
    Value: !GetAtt Environment.EndpointURL
    
  AppSecretsName:
    Description: Name of the web secrets stored
    Value: !Ref SecretsName
    
  EbEnvironmentName:
    Value: !Ref Environment

