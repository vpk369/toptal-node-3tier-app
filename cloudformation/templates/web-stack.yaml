# Stack name ---  Toptal-PROD-Web
Description: This template creates EB application and environment for web servers.
Parameters:
  envName:
    Description: Environment name for tagging
    Type: String
    AllowedValues: 
      - DEV
      - PROD
    Default: 'PROD'

  CreatedByTag:
    Description: Email ID of the team that creates this stack
    Type: String
    Default: vpk369@gmail.com

  ProductName:
    Description: A Product name that will be prefixed to resource names
    Type: String
    AllowedValues: 
      - Toptal
    Default: 'Toptal'

  AlbLogsBucket:
    Description: Enter bucket name for Beanstalk ALB access logs
    Type: String
    AllowedValues:
      - toptal-website-virginia
    Default: 'toptal-website-virginia'

  AlbLogsBucketPrefix:
    Description: Enter bucket prefix for ALB access logs
    Type: String
    AllowedValues:
      - dev/webserver-alb-logs
      - prod/webserver-alb-logs
    Default: 'prod/webserver-alb-logs'

  # CertificateArn:
  #   Description: Certificate ARN for ALB LB Listener
  #   Type: String
  #   Default: arn:aws:acm:eu-west-1:xxxxxx:certificate/2834cc16-45a6-4042-a910-ff6aa78789b6

  lambdaName:
    Description: Name of the Lambda function to insert web secrets
    Type: String
    AllowedValues: 
      - ProvisionDatabaseSecrets
      - ProvisionWebSecrets
    Default: 'ProvisionWebSecrets'

  EBAppName: 
    Description: EB App name <Product>-<Environment>-<Asset>
    Type: String
    Default: Toptal-PROD-Web-App

  EBVPC:
    Type: String
    Description: vpc id for EB
    Default: vpc-09fd98ff1e314078d

  EBSubnet:
    Description: subnet id (private) for EB instances . This is used for AutoScaling group.
    Type: String
    Default: "subnet-01d54f4ea499a1120,subnet-011deb299e8f5b0bd"

  ALBSubnets:
    Description: subnet ids (public) for EB ALB
    Type: String
    Default: "subnet-03bbac50e0f1f3263,subnet-087c328a9ddbc1a52"

  AutoScalingMinInstanceCount:
    Description: ASG min instance count
    Type: String
    Default: 1

  AutoScalingMaxInstanceCount:
    Description: ASG max instance count
    Type: String
    Default: 2

  AutoScalingInstanceType:
    Description: AutoScaling Instance Type
    Type: String
    AllowedValues:
      - t2.micro
    Default: t2.micro

  EC2KeyPairName:
    Description: EC2 key pair name
    Type: AWS::EC2::KeyPair::KeyName
    Default: toptal-screening

  ALBScheme:
    Description: Public ALB # can be internal ALB
    Type: String
    Default: public #can be internal

  SecretsName:
    Description: Secrets name for Web Server
    Type: String
    Default: "PROD/Toptal/WebEB"

  SolutionStackName:
    Description: Solution Stack Name for EB platform
    Type: String
    Default: 64bit Amazon Linux 2018.03 v2.14.3 running Docker 18.09.9-ce

  SecurityGroupStackName:
    Description: Name of the Security Groups stack. This is used in exporting SG values from that stack.
    Type: String
    Default: "Toptal-PROD-SecurityGroups"

  SharedInfraStackName:
    Description: Name of the SharedInfra stack. This is used in exporting SNS topic ARN.
    Type: String
    Default: "Toptal-PROD-Shared-Infra"

  EbEnvironmentURL:
    Description: Prefix for your Beanstalk environment URL.
    Type: String
    Default: "toptal-prod-web"

Resources:

    ElasticBeanstalkServiceRole:
      Type: AWS::IAM::Role
      Properties:
        Path: /
        AssumeRolePolicyDocument: |
          {
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Service": [ "elasticbeanstalk.amazonaws.com" ]},
              "Action": [ "sts:AssumeRole" ]
            }]
          }
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
          - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService
          - arn:aws:iam::aws:policy/AmazonSNSFullAccess

    EBApplication:
      Type: AWS::ElasticBeanstalk::Application
      Properties: 
          ApplicationName: !Ref EBAppName
    
    ConfigurationTemplate:
      Type: AWS::ElasticBeanstalk::ConfigurationTemplate
      Properties:
          ApplicationName: !Ref EBAppName
          SolutionStackName: !Ref SolutionStackName
          OptionSettings:
            #deployment options

            - Namespace: aws:elasticbeanstalk:command
              OptionName: DeploymentPolicy
              Value: RollingWithAdditionalBatch

            - Namespace: aws:elasticbeanstalk:command
              OptionName: BatchSizeType
              Value: Percentage
 
            - Namespace: aws:elasticbeanstalk:command
              OptionName: BatchSize
              Value: 100

            - Namespace: aws:elasticbeanstalk:environment
              OptionName: EnvironmentType
              Value: LoadBalanced

            - Namespace: aws:elasticbeanstalk:environment
              OptionName: LoadBalancerType
              Value: application

            - Namespace: aws:elasticbeanstalk:environment
              OptionName: ServiceRole
              Value: !Ref ElasticBeanstalkServiceRole

              # autoscaling settings
            - Namespace: aws:autoscaling:asg
              OptionName: MinSize
              Value: !Ref AutoScalingMinInstanceCount

            - Namespace: aws:autoscaling:asg
              OptionName: MaxSize
              Value: !Ref AutoScalingMaxInstanceCount

            - Namespace: aws:autoscaling:launchconfiguration
              OptionName: SecurityGroups
              Value:
                Fn::ImportValue:
                  !Sub "${SecurityGroupStackName}:WebServerLBSgId" 
            
            - Namespace: aws:autoscaling:launchconfiguration
              OptionName: SecurityGroups
              Value:
                Fn::ImportValue:
                  !Sub "${SecurityGroupStackName}:WebServerSgId"
            - Namespace: aws:autoscaling:launchconfiguration
              OptionName: InstanceType
              Value: !Ref AutoScalingInstanceType

            - Namespace: aws:autoscaling:launchconfiguration
              OptionName: IamInstanceProfile
              Value: !Ref AppInstanceProfile

            - Namespace: aws:autoscaling:launchconfiguration
              OptionName: EC2KeyName
              Value: !Ref EC2KeyPairName

            - Namespace: aws:autoscaling:trigger
              OptionName: MeasureName
              Value: CPUUtilization

            - Namespace: aws:autoscaling:trigger
              OptionName: Unit
              Value: Percent

            - Namespace: aws:autoscaling:trigger
              OptionName: UpperThreshold
              Value: 50

            - Namespace: aws:autoscaling:trigger
              OptionName: LowerThreshold
              Value: 30

            - Namespace: aws:ec2:vpc
              OptionName: VPCId
              Value: !Ref EBVPC

            - Namespace: aws:ec2:vpc
              OptionName: Subnets
              Value: !Ref EBSubnet

            - Namespace: aws:ec2:vpc
              OptionName: ELBSubnets
              Value: !Ref ALBSubnets

            - Namespace: aws:ec2:vpc
              OptionName: ELBScheme
              Value: !Ref ALBScheme

            - Namespace: aws:elbv2:listener:default
              OptionName: ListenerEnabled
              Value: "true"

            - Namespace: aws:elbv2:loadbalancer
              OptionName: SecurityGroups
              Value:
                Fn::ImportValue:
                  !Sub "${SecurityGroupStackName}:WebServerLBSgId" 

            - Namespace: aws:elbv2:loadbalancer
              OptionName: AccessLogsS3Bucket
              Value: !Ref AlbLogsBucket

            - Namespace: aws:elbv2:loadbalancer
              OptionName: AccessLogsS3Enabled
              Value: "true"

            - Namespace: aws:elbv2:loadbalancer
              OptionName: AccessLogsS3Prefix
              Value: !Ref AlbLogsBucketPrefix

            - Namespace: aws:elbv2:listenerrule:default
              OptionName: PathPatterns
              Value: "/*"

            - Namespace: !Sub
              - "aws:elbv2:listener:${ListenPort}"
              - ListenPort: 80
              OptionName: Protocol
              Value: "HTTP"

            # - Namespace: !Sub
            #   - "aws:elbv2:listener:${ListenPort2}"
            #   - ListenPort2: 443
            #   OptionName: Protocol
            #   Value: "HTTPS"

            # - Namespace: !Sub
            #   - "aws:elbv2:listener:${ListenPort2}"
            #   - ListenPort2: 443
            #   OptionName: SSLCertificateArns
            #   Value: !Ref CertificateArn

              #health check path?

            - Namespace: aws:elasticbeanstalk:environment:process:default
              OptionName: HealthCheckPath
              Value: /

            - Namespace: aws:elasticbeanstalk:application
              OptionName: Application Healthcheck URL
              Value: /

            - Namespace: aws:elasticbeanstalk:environment:process:default
              OptionName: MatcherHTTPCode
              Value: 200

            - Namespace: aws:elasticbeanstalk:environment:process:default
              OptionName: StickinessEnabled
              Value: true

            - Namespace: aws:elasticbeanstalk:environment:process:default
              OptionName: StickinessLBCookieDuration
              Value: 43200

    Environment:
      Type: AWS::ElasticBeanstalk::Environment
      Properties:
        ApplicationName: !Ref EBAppName 
        CNAMEPrefix: !Ref EbEnvironmentURL 
        TemplateName: !Ref ConfigurationTemplate
        EnvironmentName: !Join [ "-", [ !Ref ProductName, !Ref envName, WebServer] ] 
        Tags:
          - 
            Key: Business / Service Owner
            Value: CSE
          -
            Key: Purpose
            Value: Web
          -
            Key: ProductID
            Value: !Ref ProductName
          -
            Key: Environment
            Value: !Sub ${envName}
          -
            Key: Name
            Value: !Sub ${ProductName}-${envName}
          - 
            Key: CreatedBy
            Value: !Sub ${CreatedByTag}
      DependsOn:
        - ConfigurationTemplate
      
    # IAM resources
    AppRole:
      Type: AWS::IAM::Role
      Properties:
        Path: /
        ManagedPolicyArns: 
          - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
          - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
          - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        AssumeRolePolicyDocument:
          Version: 2012-10-17
          Statement:
            -
              Effect: Allow
              Principal:
                Service:
                  - ec2.amazonaws.com
              Action:
                - sts:AssumeRole

    AppPolicies:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: !Sub ${ProductName}-${envName}-Secrets
        Roles:
        - !Ref AppRole
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            -
              Effect: Allow
              Action:
                - secretsmanager:GetRandomPassword
                - secretsmanager:GetResourcePolicy
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:ListSecrets
                - secretsmanager:ListSecretVersionIds
                - secretsmanager:UpdateSecret
                - secretsmanager:PutSecretValue
              Resource: "*"

    AppPolicies2:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: !Sub ${ProductName}-${envName}-ECR-ReadOnly
        Roles:
        - !Ref AppRole
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            -
              Effect: Allow
              Action:
                - ecr:GetDownloadUrlForLayer
                - ecr:BatchGetImage
                - ecr:DescribeImages
                - ecr:GetAuthorizationToken
                - ecr:DescribeRepositories
                - ecr:ListImages
                - ecr:BatchCheckLayerAvailability
                - ecr:GetRepositoryPolicy
              Resource: "*"

    AppPolicies3:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: !Sub ${ProductName}-${envName}-EB-ReadOnly
        Roles:
        - !Ref AppRole
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            -
              Effect: Allow
              Action:
                - elasticbeanstalk:DescribeEnvironments
              Resource: 
                - !Sub arn:aws:elasticbeanstalk:${AWS::Region}:${AWS::AccountId}:environment/*

    AppPolicies4:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: !Sub ${ProductName}-${envName}-S3-Access
        Roles:
        - !Ref AppRole
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            -
              Effect: Allow
              Action:
                - s3:ListBucket
                - s3:ListObjects
                - s3:PutObject
                - s3:GetObject
              Resource: 
                - !Sub "arn:aws:s3:::${AlbLogsBucket}"
                - !Sub "arn:aws:s3:::${AlbLogsBucket}/*"

    AppInstanceProfile:
      Type: AWS::IAM::InstanceProfile
      Properties:
        Path: /
        Roles:
        - !Ref AppRole

    CustomLambda:
      Type: AWS::Lambda::Function
      Properties: 
        Code:
          ZipFile: >
            var response = require('./cfn-response');
            var AWS = require('aws-sdk');
            var secretsmanager = new AWS.SecretsManager();
            exports.handler = (event, context, callback) => {
              console.log("REQUEST RECEIVED:\n" + JSON.stringify(event));
              var ebappname = event.ResourceProperties.EBAppName;
              var ebenvname = event.ResourceProperties.EBEnvName;
              var ebappurl = event.ResourceProperties.EBAppUrl;
              console.log("EB APP NAME IS : " +ebappname);
              var secretsName = event.ResourceProperties.SecretsNameApp;
              console.log("SECRETS NAME FOR APP IS : " +secretsName);
              var appRole = event.ResourceProperties.AppRole;
              secrets(secretsName,ebappname,ebenvname,appRole);
              function secrets(secretsName,ebappname,ebenvname,appRole) {
                const new_secret = {
                  'EB_WEB_APP_NAME': ebappname,
                  'EB_WEB_ENV_NAME': ebenvname,
                  'WEB_APP_ROLE': appRole,
                  'EB_WEB_APP_URL': ebappurl
                };
                var params = {
                  Name: secretsName, 
                  SecretString: JSON.stringify(new_secret),
                };
                secretsmanager.createSecret(params, function(err, data) {
                  if (err) console.log(err, err.stack); 
                  else     console.log(data);           
                });  
              }          
              var responseData = {'passwordcheck': 'Password Valid!'};
              response.send(event, context, response.SUCCESS, responseData);
            };
        FunctionName: !Join [ "-", [ !Ref ProductName, !Ref envName, WebServer, !Ref lambdaName ] ]
        Description: Lambda function for Toptal Web secrets
        Handler: index.handler
        MemorySize: 128
        Role:
          Fn::ImportValue:
            !Sub "${SharedInfraStackName}:LambdaExecutionRole" 
        Runtime: nodejs12.x
        Timeout: 300
        Tags:
          - 
            Key: Business / Service Owner
            Value: CSE
          -
            Key: Purpose
            Value: AppSecrets
          -
            Key: ProductID
            Value: !Ref ProductName
          -
            Key: Environment
            Value: !Sub ${envName}
          - 
            Key: Name
            Value: !Join [ "-", [ !Ref ProductName, !Ref envName, !Ref lambdaName ] ]

    CustomResourceLambda:
      Type: "Custom::Lambda"
      DependsOn: CustomLambda
      Version: "1.0"
      Properties:
        ServiceToken: !GetAtt CustomLambda.Arn
        EBAppName: !Ref EBAppName
        EBEnvName: !Ref Environment
        EBAppUrl: !GetAtt Environment.EndpointURL
        SecretsNameApp: !Ref SecretsName
        AppRole: !Ref AppRole

    CDN:
      Type: 'AWS::CloudFront::Distribution'
      Properties:
        DistributionConfig:
          Origins:
          - DomainName: !GetAtt Environment.EndpointURL
            Id: !Join [ "-", [ !Ref ProductName, !Ref envName, 'Origin' ] ]
            CustomOriginConfig:
              HTTPPort: '80'
              HTTPSPort: '443'
              OriginProtocolPolicy: http-only
          Enabled: 'true'
          Comment: !Join [ ' ', [ 'CDN for ', !Ref ProductName, !Ref envName ] ]
          # DefaultRootObject: index.html
          Logging:
            IncludeCookies: 'true'
            Bucket: !Join [ '', [ !Ref AlbLogsBucket, '.s3.amazonaws.com' ] ]
            Prefix: cdn-logs
          # Aliases:
          # - mysite.example.com
          # - "*.yoursite.example.com"
          DefaultCacheBehavior:
            TargetOriginId: !Join [ "-", [ !Ref ProductName, !Ref envName, 'Origin' ] ]
            # SmoothStreaming: 'false'
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: all
            ViewerProtocolPolicy: allow-all
          CustomErrorResponses:
          - ErrorCode: '404'
            ResponsePagePath: "/error-pages/404.html"
            ResponseCode: '200'
            ErrorCachingMinTTL: '30'
          # PriceClass: PriceClass_200
          # Restrictions:
          #   GeoRestriction:
          #     RestrictionType: whitelist
          #     Locations:
          #     - IN
          #     - US
          ViewerCertificate:
            CloudFrontDefaultCertificate: 'true'

Outputs:
  EndPoint:
    Description: Toptal Web EndPoint url
    Value: !GetAtt Environment.EndpointURL
    
  AppSecretsName:
    Description: Name of the web secrets stored
    Value: !Ref SecretsName
    
  EbEnvironmentName:
    Value: !Ref Environment

  CDNEndPoint:
    Description: Toptal Web CDN EndPoint url
    Value: !GetAtt CDN.DomainName

  # ToptalPagerDutySnsTopic:
  #   Description: PagerDuty SNS topic ARN
  #   Export:
  #    Name: !Join [ ":", [ !Ref "AWS::StackName", ToptalPagerDutySNSTopic ] ]
  #   Value: !Ref ToptalPagerDutySNSTopic
