image: node:latest

stages:
  - build
  # - test
  - docker-deploy-image
  - aws-deploy

cache:
  paths:
    - node_modules/

install_dependencies:
  stage: build
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

# testing:
#   stage: test
#   script: npm test

docker-deploy-image:
  stage: docker-deploy-image
  image: docker:dind
  services:
    - docker:dind
  script:
    - aws --region $AWS_BASE_REGION ecr get-login --no-include-email
    - docker build -t $REPO_URL .
    - aws ecr get-login --no-include-email
    - docker push $REPO_URL

aws-deploy:
  image: 'python:latest'
  stage: aws-deploy
  before_script:
    - 'pip install awsebcli --upgrade' # (6)
  script:
    - eb deploy TtoptalAssignment-env
