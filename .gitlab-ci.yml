# image: node:latest

stages:
  ## - test
  - docker-build-push
  - aws-deploy

cache:
  paths:
      - api/node_modules/
      - web/node_modules/

# testing:
#   stage: test
#   script: npm test

docker-build-push:
  stage: docker-build-push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - 'apk add --no-cache curl jq python py-pip'
    - 'pip install awscli'
  script: >

      . ./gitlab-variables.sh

      sed -i "s#%ECR_WEB_REPO_URL%#${ECR_WEB_REPO_URL}#g" ./web/Dockerrun.aws.json
      sed -i "s#%ECR_API_REPO_URL%#${ECR_API_REPO_URL}#g" ./api/Dockerrun.aws.json

      if [[ "$DEPLOY_TIER" == "Web" ]]; then
        cd web
        aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_WEB_REPO_URL
        docker build -t $ECR_WEB_REPO_URL .
        docker push $ECR_WEB_REPO_URL
      elif [[ "$DEPLOY_TIER" == "Api" ]]; then
        cd api
        aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_API_REPO_URL
        docker build -t $ECR_API_REPO_URL .
        docker push $ECR_API_REPO_URL
      elif [[ "$DEPLOY_TIER" == "Both" ]]; then
        cd web;
        aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_WEB_REPO_URL
        docker build -t $ECR_WEB_REPO_URL .
        docker push $ECR_WEB_REPO_URL
        cd ../api;
        aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_API_REPO_URL
        docker build -t $ECR_API_REPO_URL .
        docker push $ECR_API_REPO_URL
        cd ..
      fi

aws-deploy:
  stage: aws-deploy
  image: python:latest
  before_script:
    - 'apt-get update && apt-get install -y jq'
    - 'pip install awscli awsebcli --upgrade'
  script:
    - |

      . ./gitlab-variables.sh

      rm ./web/Dockerfile ./api/Dockerfile

      if [[ "$DEPLOY_TIER" == "Web" ]]; then
        cd web;
        eb deploy $EB_WEB_ENV_NAME
      elif [[ "$DEPLOY_TIER" == "Api" ]]; then
        cd api;
        eb deploy $EB_API_ENV_NAME
      elif [[ "$DEPLOY_TIER" == "Both" ]]; then
         cd web;
         eb deploy $EB_WEB_ENV_NAME
         cd ../api;
         eb deploy $EB_API_ENV_NAME
      fi