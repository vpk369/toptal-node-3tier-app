image: node:latest

stages:
  - build
  ## - test
  - docker-deploy-image
  - aws-deploy

cache:
  paths:
      - api/node_modules/
      - web/node_modules/

install_dependencies:
  stage: build
  script: >
    if [[ "$DEPLOY_TIER" == "Web" ]]; then
      cd web;
      npm install;
    elif [[ "$DEPLOY_TIER" == "Api" ]]; then
      cd api;
      npm install;
    elif [[ "$DEPLOY_TIER" == "Both" ]]; then
      cd web;
      npm install;
      cd ../api;
      npm install;
      cd ..
    fi
  artifacts:
    paths:
      - api/node_modules/
      - web/node_modules/

# testing:
#   stage: test
#   script: npm test

docker-deploy-image:
  stage: docker-deploy-image
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - 'apk add --no-cache curl jq python py-pip'
    - 'pip install awscli'
  script: >

    if [[ "$DEPLOY_TIER" == "Web" ]]; then
      cd web
      aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_WEB_REPO_URL
      docker build -t $ECR_WEB_REPO_URL .
      docker push $ECR_WEB_REPO_URL
    elif [[ "$DEPLOY_TIER" == "Api" ]]; then
      cd api
      aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_API_REPO_URL
      docker build -t $ECR_API_REPO_URL .
      docker push $ECR_API_REPO_URL
    elif [[ "$DEPLOY_TIER" == "Both" ]]; then
      cd web;
      aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_WEB_REPO_URL
      docker build -t $ECR_WEB_REPO_URL .
      docker push $ECR_WEB_REPO_URL
      cd ../api;
      aws ecr get-login-password --region $AWS_REGION | docker login -u AWS --password-stdin $ECR_API_REPO_URL
      docker build -t $ECR_API_REPO_URL .
      docker push $ECR_API_REPO_URL
      cd ..
    fi

aws-deploy:
  stage: aws-deploy
  image: python:latest
  before_script:
    - 'apt-get update && apt-get install -y jq'
    - 'pip install awscli awsebcli --upgrade'
  script:
    - |
      EB_CONFIG_DIR='.elasticbeanstalk'
      EB_EXT_DIR='.ebextensions'
      SSH_KEY_NAME='toptal-screening'
      VPN_SG='Toptal-PROD-VPN'

      SECRETS_API_EB='PROD/Toptal/ApiEB'
      secrets_api_eb_file='./secrets_api_eb.json'
      SECRETS_WEB_EB='PROD/Toptal/WebEB'
      secrets_web_eb_file='./secrets_web_eb.json'
      SECRETS_DB='PROD/Toptal/DBCred'
      secrets_db_file='./secrets_web_eb.json'
      secrets_file='./secrets.json'
      vars_file='/tmp/vars'

      aws secretsmanager get-secret-value --secret-id $SECRETS_API_EB --output json --region $AWS_REGION  | jq --raw-output '.SecretString' > $secrets_api_eb_file
      #change below to $SECRETS_WEB_EB ---@@@@@@@@@@@@@@ todo
      aws secretsmanager get-secret-value --secret-id $SECRETS_API_EB --output json --region $AWS_REGION | jq --raw-output '.SecretString' > $secrets_web_eb_file
      aws --output json --region $AWS_REGION secretsmanager get-secret-value --secret-id $SECRETS_DB | jq -r '.SecretString' > $secrets_db_file

      # merging 2 secrets
      jq -s ".|add" $secrets_db_file $secrets_api_eb_file $secrets_web_eb_file > $secrets_file

      # putting secrets as bash variables
      jq -r "to_entries|map(.key+\"=\"+.value|tostring)|.[]" $secrets_file > $vars_file
      chmod +x $vars_file

      . $vars_file

      if [[ "$DEPLOY_TIER" == "Web" ]]; then
        cd web;
        #update .ebextensions/config.yml file
        sed -i "s#%EB_WEB_APP_NAME%#${EB_WEB_APP_NAME}#g" $EB_CONFIG_DIR/config.yml
        sed -i "s#%SSH_KEY_NAME%#${SSH_KEY_NAME}#g" $EB_CONFIG_DIR/config.yml
        sed -i "s#%AWS_REGION%#${AWS_REGION}#g" $EB_CONFIG_DIR/config.yml

        sed -i "s#%SECURITY_GROUP%#${VPN_SG}#g" $EB_EXT_DIR/02-launch.config

        # putting secrets as bash variables
        jq -r 'to_entries|map(.key+"="+.value|tostring)|.[]' $secrets_api_file > $vars_file
        chmod +x $vars_file

        . $vars_file

        echo "API_HOST=$EB_API_APP_URL" > .env
        echo "PORT=80" >> .env
        chmod +r .env

        eb deploy $EB_WEB_ENV_NAME
      elif [[ "$DEPLOY_TIER" == "Api" ]]; then
        cd api;
        #update .ebextensions/config.yml file
        sed -i "s#%EB_API_APP_NAME%#${EB_API_APP_NAME}#g" $EB_CONFIG_DIR/config.yml
        sed -i "s#%SSH_KEY_NAME%#${SSH_KEY_NAME}#g" $EB_CONFIG_DIR/config.yml
        sed -i "s#%AWS_REGION%#${AWS_REGION}#g" $EB_CONFIG_DIR/config.yml
        sed -i "s#%SECURITY_GROUP%#${VPN_SG}#g" $EB_EXT_DIR/02-launch.config

        #create env varas for this app
        echo "DB=$CONN_STRING" > .env
        echo "PORT=80" >> .env
        chmod +r .env

        eb deploy $EB_API_ENV_NAME
      elif [[ "$DEPLOY_TIER" == "Both" ]]; then
         cd web;
         # @@todo .. similar code like api
         eb deploy $EB_WEB_ENV_NAME
         cd ../api;
         # @@todo .. copy code of api if here
         eb deploy $EB_API_ENV_NAME
      fi
