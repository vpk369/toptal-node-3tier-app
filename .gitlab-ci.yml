image: node:latest

stages:
  - build
  # - test
  - docker-deploy-image
  - aws-deploy

cache:
  paths:
    - node_modules/

install_dependencies:
  stage: build
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

# testing:
#   stage: test
#   script: npm test

docker-deploy-image:
  stage: docker-deploy-image
  image: docker:dind
  services:
    - docker:dind
  script:
    - aws --region $AWS_BASE_REGION ecr get-login --no-include-email
    - docker build -t $ECR_REPO_URL .
    # - aws ecr get-login --no-include-email
    - docker push $ECR_REPO_URL

aws-deploy:
  image: 'python:latest'
  stage: aws-deploy
  before_script:
    - 'pip install awsebcli --upgrade'
  script:
    - >
    if [ "$DEPLOY_TIER" == "Web" ]; then
      cd web;
      eb deploy %EB_WEB_APP_NAME%
    elif [ "$DEPLOY_TIER" == "Api" ]; then
      cd api;
      eb deploy %EB_API_APP_NAME%
    elif [ "$DEPLOY_TIER" == "Both" ]; then
      cd web;
      eb deploy %EB_WEB_APP_NAME%
      cd api;
      eb deploy %EB_API_APP_NAME%
    fi
